[project]
name = "sklearn-playground"
version = "0.1.0"
description = "Interactive scikit-learn learning playground built with Streamlit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sklearn-playground contributors" }]
keywords = ["machine-learning", "scikit-learn", "streamlit", "education", "interactive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "streamlit>=1.28.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pandas-stubs>=2.0.0",
]
export = [
    "skops>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/example/sklearn-playground"
Documentation = "https://github.com/example/sklearn-playground#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skplay"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"pages/*.py" = ["E402"]  # Streamlit requires st.set_page_config before imports

[tool.ruff.lint.isort]
known-first-party = ["skplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = false  # Too strict for numpy/pandas code
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["skplay.core.preprocessing", "skplay.core.evaluation", "skplay.core.tuning"]
disable_error_code = ["arg-type", "return-value"]  # Complex numpy/pandas typing
